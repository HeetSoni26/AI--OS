name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Coverage gates
        run: npm run test:coverage
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AIOS_RATE_LIMIT_BACKEND: memory
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aios:aios@127.0.0.1:5432/aios_test
      DIRECT_URL: postgresql://aios:aios@127.0.0.1:5432/aios_test
      TEST_DATABASE_URL: postgresql://aios:aios@127.0.0.1:5432/aios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply clean migration
        run: npm run db:migrate:deploy
      - name: Seed twice to prove idempotency
        run: npm run db:seed && npm run db:seed
      - name: Reapply deploy command on seeded schema
        run: npm run db:migrate:deploy
      - name: Verify migration status
        run: npm run db:status
      - name: Run PostgreSQL and pgvector integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aios_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aios:aios@127.0.0.1:5432/aios_e2e
      DIRECT_URL: postgresql://aios:aios@127.0.0.1:5432/aios_e2e
      TEST_DATABASE_URL: postgresql://aios:aios@127.0.0.1:5432/aios_e2e
      AIOS_OWNER_AUTH_SUBJECT: 00000000-0000-4000-8000-000000000001
      AIOS_OWNER_EMAIL: owner@local.aios
      AIOS_OWNER_DISPLAY_NAME: E2E Owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare migrated owner database
        run: npm run db:migrate:deploy && npm run db:seed && npm run db:bootstrap-owner
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          AIOS_AUTH_BYPASS: development-shell
          AIOS_RATE_LIMIT_BACKEND: memory
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
